name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The service, storage ACLs and worker Job objects are Windows-specific (see docs/development.md).
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint, format and tests
        run: uv run --no-sync python scripts/check.py

      - name: Build
        run: uv build --no-build-isolation --offline

      - name: Archived experiment checks (outside product suite)
        run: |
          uv run --no-sync python -m ruff check experiments
          uv run --no-sync python -m ruff format --check experiments
          uv run --no-sync python -m pytest experiments/output_filter -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Desktop state and failure recovery tests
        run: node --test scripts/test_window_state.cjs scripts/test_locales.cjs scripts/test_project_switch.cjs scripts/test_bridge_client.cjs scripts/test_diagnostics.cjs
