[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jev-context"
version = "0.2.0"
description = "Local judgment and evidence-preserving context coordination for Codex"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==1.30.0", "jsonschema>=4.23,<5", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
jev-context = "jev_context.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
